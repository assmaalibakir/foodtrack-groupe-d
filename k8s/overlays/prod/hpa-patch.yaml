# Autoscaling de production privilegiant disponibilite et reactivite.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-capteurs
spec:
  # Deux repliques restent actives et une troisieme peut etre creee a 60 %.
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
