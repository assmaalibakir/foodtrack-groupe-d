# Assemble la base commune avec les reglages de la production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: foodtrack-prod
resources:
  # Le namespace est cree avant les ressources applicatives communes.
  - namespace.yaml
  - ../../base
configMapGenerator:
  # Fusionne les paramètres de production avec les fichiers communs du portail.
  - name: foodtrack-config
    behavior: merge
    files:
      # Personnalise le portail sans dupliquer son HTML, son CSS ou son JavaScript.
      - environment.js
    literals:
      # Parametres non sensibles consommes par l'API et affiches par le portail.
      - ENVIRONMENT=prod
      - SEUIL_TEMPERATURE_C=4
      - NIVEAU_JOURNAL=warn
replicas:
  # Deux repliques du portail ameliorent sa disponibilite en production.
  - name: portail-qualite
    count: 2
patches:
  # La production double la capacite persistante de Redis a 20 Gi.
  - target:
      kind: StatefulSet
      name: cache-releves
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi

  # Maintient deux repliques d'API et permet une montee a trois.
  - path: hpa-patch.yaml
