# Reverse proxy et serveur de fichiers statiques du portail FoodTrack.
server {
    # Le Service Kubernetes et les sondes utilisent ce port.
    listen 8080;
    server_name _;

    # Route legere utilisee par Kubernetes et le load balancer GKE.
    location = /healthz {
        # Les appels frequents des sondes ne polluent pas les journaux d'acces.
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Les requetes /api/ sont transmises au Service interne de l'API.
    location /api/ {
        proxy_pass http://api-capteurs:8080/;

        # Conserve l'hote et l'adresse d'origine pour le diagnostic.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Evite de bloquer trop longtemps si l'API devient indisponible.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Toutes les autres routes servent les fichiers statiques du portail.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
