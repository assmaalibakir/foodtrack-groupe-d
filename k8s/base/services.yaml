apiVersion: v1
kind: Service
metadata:
  name: portail-qualite
spec:
  type: ClusterIP
  selector: {app: portail-qualite}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: api-capteurs
spec:
  type: ClusterIP
  selector: {app: api-capteurs}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: cache-releves
spec:
  type: ClusterIP
  clusterIP: None
  selector: {app: cache-releves}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
