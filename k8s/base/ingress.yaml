apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portail-qualite
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portail-qualite
                port:
                  number: 8080
